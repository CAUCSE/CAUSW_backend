name: CD - Develop (Docker/ECR)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 배포가 겹치면 두 실행이 같은 슬롯을 서로 차지하려 들어 상태가 깨집니다.
# 진행 중인 배포는 끝까지 두고, 뒤따라온 실행이 기다립니다.
concurrency:
  group: cd-dev
  # queue 기본값(single)은 새 실행이 '대기 중'인 실행을 취소합니다.
  # max 로 두면 최대 100건까지 줄을 서므로 배포가 유실되지 않습니다.
  # (queue: max 와 cancel-in-progress: true 는 함께 쓸 수 없습니다)
  queue: max
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ccssaa/ccssaa-backend-dev

jobs:
  # ─────────────────────────────────────────
  # 1. Docker 이미지 빌드 & ECR push
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      migration_image: ${{ steps.build-image.outputs.migration_image }}
      migration_changed: ${{ steps.filter.outputs.migration }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Detect migration changes
        id: filter
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            migration:
              - 'app-main/src/main/resources/db/migration/**'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          MIGRATION_IMAGE="$IMAGE:dev-$IMAGE_TAG-migration"
          docker build --target migration -t "$MIGRATION_IMAGE" .
          docker build -t "$IMAGE:dev-$IMAGE_TAG" -t "$IMAGE:dev-latest" .
          docker push "$MIGRATION_IMAGE"
          docker push "$IMAGE:dev-$IMAGE_TAG"
          docker push "$IMAGE:dev-latest"
          echo "image=$IMAGE:dev-$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "migration_image=$MIGRATION_IMAGE" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────
  # 2. DB 마이그레이션 (EC2에서 실행 - Private RDS 접근)
  # ─────────────────────────────────────────
  flyway-migrate:
    name: Flyway Migration
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' || needs.build-and-push.outputs.migration_changed == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Write .env to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_CONTENT: ${{ secrets.ENV_DEV }}
        with:
          key: ${{ secrets.EC2_KEY_DEV }}
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER_DEV }}
          envs: ENV_CONTENT
          script: |
            mkdir -p /home/ubuntu/app/app-main
            printf '%s' "$ENV_CONTENT" > /home/ubuntu/app/app-main/.env

      - name: Run Flyway on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          MIGRATION_IMAGE: ${{ needs.build-and-push.outputs.migration_image }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          key: ${{ secrets.EC2_KEY_DEV }}
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER_DEV }}
          envs: MIGRATION_IMAGE,AWS_REGION
          script: |
            set -euo pipefail

            : "${MIGRATION_IMAGE:?MIGRATION_IMAGE variable is required}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "${MIGRATION_IMAGE%%/*}"

            docker pull "$MIGRATION_IMAGE"

            docker run --rm \
              --env-file /home/ubuntu/app/app-main/.env \
              --add-host=host.docker.internal:host-gateway \
              "$MIGRATION_IMAGE" \
              migrate

  # ─────────────────────────────────────────
  # 3. EC2 배포
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2 via SSH
    needs: [ build-and-push, flyway-migrate ]
    if: ${{ always() && needs.build-and-push.result == 'success' && (needs.flyway-migrate.result == 'success' || needs.flyway-migrate.result == 'skipped') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Start redis-server
        uses: appleboy/ssh-action@v1.2.0
        with:
          key: ${{ secrets.EC2_KEY_DEV }}
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER_DEV }}
          script: |
            sudo systemctl start redis-server

      # blue/green 배포는 저장소 변수 BLUE_GREEN_ENABLED_DEV 로 켜고 끕니다.
      #   'true'  -> scripts/ec2/blue-green-deploy.sh  (무중단)
      #   그 외   -> .github/scripts/restart-container.sh (기존 방식)
      # 문제가 생기면 변수만 false 로 되돌리면 됩니다. revert 커밋이 필요 없습니다.
      #
      # 아래 vars 는 비워두어도 됩니다. 스크립트에 기본값이 있습니다.
      #   CONTAINER_MEM_MB_DEV        컨테이너 RAM 한도(MB), 0 또는 미설정이면 제한 없음
      #   CONTAINER_MEMSWAP_MB_DEV    RAM+스왑 합계 한도(MB), 미설정이면 스왑 불허
      #   JAVA_TOOL_OPTIONS_DEV       JVM 옵션. 힙 제한은 -Xmx 로 지정 (스크립트 주석 참고)
      #   HEALTH_TIMEOUT_SECONDS_DEV  헬스체크 최대 대기 (기본 300)
      #   GRACE_PERIOD_SECONDS_DEV    전환 후 구 컨테이너 보존 시간 (기본 30)
      #   MIN_AVAILABLE_MB_DEV         기동 전 최소 가용 메모리(MB). 미달이면 배포 중단 (기본 0=검사안함)
      #   NEW_OOM_SCORE_ADJ_DEV        전역 OOM 시 새 컨테이너를 먼저 죽이기 위한 가산치 (기본 500)
      - name: Restart container with new image
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          MIGRATION_IMAGE: ${{ needs.build-and-push.outputs.migration_image }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
          CONTAINER_MEM_MB: ${{ vars.CONTAINER_MEM_MB_DEV }}
          CONTAINER_MEMSWAP_MB: ${{ vars.CONTAINER_MEMSWAP_MB_DEV }}
          JAVA_TOOL_OPTIONS: ${{ vars.JAVA_TOOL_OPTIONS_DEV }}
          HEALTH_TIMEOUT_SECONDS: ${{ vars.HEALTH_TIMEOUT_SECONDS_DEV }}
          GRACE_PERIOD_SECONDS: ${{ vars.GRACE_PERIOD_SECONDS_DEV }}
          MIN_AVAILABLE_MB: ${{ vars.MIN_AVAILABLE_MB_DEV }}
          NEW_OOM_SCORE_ADJ: ${{ vars.NEW_OOM_SCORE_ADJ_DEV }}
        with:
          key: ${{ secrets.EC2_KEY_DEV }}
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER_DEV }}
          envs: IMAGE,MIGRATION_IMAGE,APP_CONTAINER_NAME,AWS_REGION,CONTAINER_MEM_MB,CONTAINER_MEMSWAP_MB,JAVA_TOOL_OPTIONS,HEALTH_TIMEOUT_SECONDS,GRACE_PERIOD_SECONDS,MIN_AVAILABLE_MB,NEW_OOM_SCORE_ADJ
          script_path: ${{ vars.BLUE_GREEN_ENABLED_DEV == 'true' && 'scripts/ec2/blue-green-deploy.sh' || '.github/scripts/restart-container.sh' }}

  # ─────────────────────────────────────────
  # 4. Discord 배포 결과 알림
  # ─────────────────────────────────────────
  notify:
    name: Discord Notify
    needs: [ deploy ]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Notify Success
        if: needs.deploy.result == 'success'
        uses: ./.github/actions/discord-notify
        with:
          repository: ${{ github.repository }}
          status: success
          branch: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          run_id: ${{ github.run_id }}
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL_DEV }}
          role_id: ${{ secrets.DISCORD_BACKEND_ROLE_ID }}

      - name: Notify Failure
        if: needs.deploy.result != 'success'
        uses: ./.github/actions/discord-notify
        with:
          repository: ${{ github.repository }}
          status: failure
          branch: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          run_id: ${{ github.run_id }}
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL_DEV }}
          role_id: ${{ secrets.DISCORD_BACKEND_ROLE_ID }}
